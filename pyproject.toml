[project]
name = "slmagent"
version = "0.1.0"
description = "SLMAgent — Simple Local Media Agent (Phase A local mock)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "gradio>=5.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.0",
  "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["slmagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
